<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App do Clima</title>
    <!-- Estilos principais -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <main class="container">
    <!-- Título principal da aplicação -->
    <h1>Previsão do Tempo</h1>

    <!-- Formulário de busca de cidade -->
    <form id="weather-form">
      <input type="text" id="city-input" placeholder="Digite o nome da cidade" required>
      <button type="submit">Buscar</button>
    </form>

    <!-- Seção de resultados da previsão -->
    <section id="weather-result" class="hidden">
      <h2 id="city-name"></h2>
      <!-- Ícone será adicionado aqui dinamicamente -->
      <p id="temperature"></p>
      <p id="description"></p>
    </section>

    <!-- Mensagens de erro exibidas ao usuário -->
    <p id="error-message" class="error"></p>
  </main>

  <script type="module" src="./assets/js/main.js"></script>
   <!-- Rodapé com informações da autora -->
  <footer class="author">
    <h3>🧑‍💻 Autora</h3>
    <p><strong>Geovana Cazali</strong></p>
    <p>💼 Desenvolvedora Full Stack em formação</p>
    <p>📚 Projeto desenvolvido no Bootcamp Generation Brasil</p>
    <p>
      🔗 
      <a href="https://www.linkedin.com/in/geovana-cazali/" target="_blank">LinkedIn</a> | 
      <a href="https://github.com/sgeo21" target="_blank">GitHub</a></p>
      <p>🌤️ Dados meteorológicos por <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a></p>
  </footer>
</body>
</html>
